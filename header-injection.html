<style>

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --brand:       #CD87B9;                    /* primary mauve/pink       */
  --brand-hover: #B86EA0;                    /* darker on hover          */
  --brand-glow:  rgba(205,135,185,0.25);
  --dark:        #000000;                    /* page background          */
  --mid:         #111111;                    /* card / alternate section */
  --card:        #0D0D0D;                    /* form fields, blockquotes */
  --white:       #ffffff;
  --muted:       rgba(255,255,255,0.60);     /* body copy                */
  --dim:         rgba(255,255,255,0.35);     /* placeholders, labels     */
  --radius:      10px;
  --speed:       0.22s;

  /* Legacy alias kept so nothing else breaks */
  --black: #000000;
}


/* ============================================================
   GLOBAL DARK BASE
   ============================================================ */
html,
body {
  background-color: var(--dark) !important;
  color: var(--white) !important;
  font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif !important;
  -webkit-font-smoothing: antialiased !important;
}

/* All Squarespace section types — 7.0 and 7.1 templates */
.page-section,
[data-section-type],
[data-section-id],
.sqs-layout,
.sqs-row,
.Main,
main,
main#page,
#main,
#content,
.content,
.content-wrapper,
.site-canvas,
.sqs-site-wrapper {
  background-color: var(--dark) !important;
}

/* Alternate sections get slightly lighter so rows have rhythm */
.page-section:nth-child(even) {
  background-color: var(--mid) !important;
}


/* ============================================================
   TYPOGRAPHY
   ============================================================ */
h1, h2, h3, h4, h5, h6 {
  font-family: 'Barlow Condensed', 'Barlow', sans-serif !important;
  font-weight: 900 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.04em !important;
  line-height: 1.05 !important;
  color: var(--white) !important;
}

h1 { font-size: clamp(2.8rem, 7vw,  5.5rem) !important; }
h2 { font-size: clamp(2rem,  5vw,  3.5rem)  !important; }
h3 { font-size: clamp(1.3rem, 3vw,  2rem)   !important; }

/* Coloured spans inside headings (Squarespace rich-text bold) */
h1 strong, h2 strong, h3 strong,
h1 em,     h2 em,     h3 em {
  color: var(--brand) !important;
  font-style: normal !important;
}

p, li {
  font-family: 'Barlow', sans-serif !important;
  font-size: 1.05rem !important;
  line-height: 1.7 !important;
  color: var(--muted) !important;
}

strong, b {
  color: var(--white) !important;
}

a {
  color: var(--brand) !important;
  text-decoration: none !important;
  transition: color var(--speed) ease !important;
}
a:hover { color: var(--brand-hover) !important; }


/* ============================================================
   ANNOUNCEMENT BAR  ($0 call-out fee banner)
   ============================================================ */
.announcement-bar-wrapper,
.header-announcement-bar-wrapper,
[class*="AnnouncementBar"],
.sqs-announcement-bar-dropzone {
  background-color: var(--brand) !important;
}

.announcement-bar-text,
[class*="AnnouncementBar"] p,
[class*="AnnouncementBar"] span,
[class*="AnnouncementBar"] a,
.announcement-bar p,
.announcement-bar span,
.announcement-bar a {
  color: #fff !important;
  font-family: 'Barlow', sans-serif !important;
  font-weight: 800 !important;
  font-size: 0.85rem !important;
  letter-spacing: 0.12em !important;
  text-transform: uppercase !important;
}


/* ============================================================
   NAVIGATION
   ============================================================ */
header#header,
header.site-header,
.header,
.site-header,
[data-section-type="header"],
.header-inner,
.header-display-desktop,
.header-display-mobile {
  background-color: var(--dark) !important;
  border-bottom: 1px solid rgba(255,255,255,0.07) !important;
  box-shadow: 0 2px 20px rgba(0,0,0,0.5) !important;
}

/* Nav links */
.header-nav-item a,
.header-nav-item--folder a,
nav a {
  font-family: 'Barlow', sans-serif !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.08em !important;
  font-size: 0.88rem !important;
  color: rgba(255,255,255,0.75) !important;
  transition: color var(--speed) ease !important;
}

.header-nav-item a:hover,
.header-nav-item--folder a:hover {
  color: var(--brand) !important;
}

.header-nav-item--active a,
.header-nav-item.active a {
  color: var(--brand) !important;
}

/* Site name / logo text */
.site-title,
.site-title a,
.header-title-logo,
.header-title a,
.header-branding a {
  font-family: 'Barlow Condensed', sans-serif !important;
  font-weight: 900 !important;
  letter-spacing: 0.05em !important;
  text-transform: uppercase !important;
  color: var(--white) !important;
}

/* Mobile burger icon */
.header-burger-btn,
.mobile-bar-controls button {
  color: var(--white) !important;
}

/* Mobile drawer */
.header-menu-nav-list a,
.header-menu-nav-folder-toggle {
  color: var(--white) !important;
  font-family: 'Barlow', sans-serif !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
}


/* ============================================================
   BUTTONS
   ============================================================ */
.sqs-block-button-element,
.sqs-block-button-element--primary,
.sqs-block-button-element--secondary,
a.sqs-block-button-element,
button[type="submit"],
input[type="submit"] {
  background-color: var(--brand) !important;
  color: #fff !important;
  font-family: 'Barlow', sans-serif !important;
  font-weight: 800 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  border: none !important;
  border-radius: var(--radius) !important;
  padding: 16px 40px !important;
  font-size: 1rem !important;
  cursor: pointer !important;
  transition: background-color var(--speed) ease,
              transform var(--speed) ease,
              box-shadow var(--speed) ease !important;
  box-shadow: 0 4px 18px var(--brand-glow) !important;
  text-decoration: none !important;
  display: inline-block !important;
}

.sqs-block-button-element:hover,
.sqs-block-button-element--primary:hover,
button[type="submit"]:hover,
input[type="submit"]:hover {
  background-color: var(--brand-hover) !important;
  color: #fff !important;
  transform: translateY(-3px) !important;
  box-shadow: 0 8px 28px var(--brand-glow) !important;
  text-decoration: none !important;
}

.sqs-block-button-element:active {
  transform: translateY(-1px) !important;
}


/* ============================================================
   BLOCKQUOTES / TESTIMONIALS
   ============================================================ */
blockquote,
.sqsrte-blockquote,
[data-block-type="quote"] blockquote,
.sqs-block-quote blockquote {
  border-left: 5px solid var(--brand) !important;
  border-radius: 0 var(--radius) var(--radius) 0 !important;
  padding: 24px 28px 24px 36px !important;
  margin: 0 0 20px 0 !important;
  background: var(--mid) !important;
  position: relative !important;
}

blockquote::before {
  content: '\201C' !important;
  font-family: Georgia, serif !important;
  font-size: 6rem !important;
  color: var(--brand) !important;
  opacity: 0.2 !important;
  position: absolute !important;
  top: -12px !important;
  left: 8px !important;
  line-height: 1 !important;
  pointer-events: none !important;
  user-select: none !important;
}

blockquote p,
.sqsrte-blockquote p {
  font-family: 'Barlow', sans-serif !important;
  font-style: italic !important;
  font-size: 1.05rem !important;
  color: rgba(255,255,255,0.85) !important;
  line-height: 1.7 !important;
  margin: 0 0 10px 0 !important;
}

blockquote footer,
blockquote cite,
.sqsrte-blockquote cite,
.sqs-block-quote .source {
  font-family: 'Barlow', sans-serif !important;
  font-weight: 700 !important;
  font-style: normal !important;
  font-size: 0.85rem !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  color: var(--brand) !important;
  display: block !important;
  margin-top: 8px !important;
}


/* ============================================================
   IMAGE / GALLERY HOVER
   ============================================================ */
.sqs-block-image img,
.sqs-gallery-block-item img {
  border-radius: var(--radius) !important;
  transition: transform var(--speed) ease,
              box-shadow var(--speed) ease !important;
}

.sqs-block-image:hover img,
.sqs-gallery-block-item:hover img {
  transform: scale(1.03) !important;
  box-shadow: 0 10px 36px rgba(0,0,0,0.55) !important;
}


/* ============================================================
   FORMS & CONTACT
   ============================================================ */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="number"],
textarea,
select,
.field-element input,
.field-element textarea {
  background-color: var(--card) !important;
  border: 1px solid rgba(255,255,255,0.12) !important;
  border-radius: var(--radius) !important;
  color: var(--white) !important;
  font-family: 'Barlow', sans-serif !important;
  font-size: 1rem !important;
  transition: border-color var(--speed) ease,
              box-shadow var(--speed) ease !important;
}

input::placeholder,
textarea::placeholder {
  color: var(--dim) !important;
}

input:focus,
textarea:focus,
select:focus {
  outline: none !important;
  border-color: var(--brand) !important;
  box-shadow: 0 0 0 3px var(--brand-glow) !important;
}

label,
.field-label {
  font-family: 'Barlow', sans-serif !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.07em !important;
  font-size: 0.82rem !important;
  color: var(--dim) !important;
}


/* ============================================================
   FOOTER — black background, white text, pink top border
   ============================================================ */
footer.site-footer,
footer,
[data-section-type="footer"] {
  background-color: var(--dark) !important;
  border-top: 4px solid var(--brand) !important;
  padding-top: 56px !important;
  padding-bottom: 40px !important;
}

footer p, footer span, footer li,
.site-footer p, .site-footer span, .site-footer li {
  color: rgba(255,255,255,0.55) !important;
}

footer h1, footer h2, footer h3, footer h4,
.site-footer h1, .site-footer h2, .site-footer h3 {
  color: var(--white) !important;
}

footer a,
.site-footer a {
  color: var(--brand) !important;
  transition: opacity var(--speed) ease !important;
}

footer a:hover,
.site-footer a:hover {
  opacity: 0.75 !important;
  text-decoration: none !important;
}


/* ============================================================
   HORIZONTAL RULES
   ============================================================ */
hr {
  border: none !important;
  border-top: 1px solid rgba(205,135,185,0.2) !important;
  margin: 40px 0 !important;
}


/* ============================================================
   MOBILE RESPONSIVE
   ============================================================ */
@media (max-width: 767px) {
  h1 { font-size: 2.6rem !important; }
  h2 { font-size: 1.9rem !important; }
  h3 { font-size: 1.4rem !important; }

  .sqs-block-button-element,
  .sqs-block-button-element--primary {
    width: 100% !important;
    text-align: center !important;
    padding: 16px 24px !important;
  }

  blockquote { padding: 20px 20px 20px 28px !important; }

  /* Space above sticky button */
  body { padding-bottom: 76px !important; }
}

@media (min-width: 768px) {
  body { padding-bottom: 0 !important; }
}


/* ============================================================
   STICKY CALL BUTTON (mobile only)
   Floating pill at bottom — tap to call instantly.
   ============================================================ */
.yl-sticky-call {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: var(--dark);
  color: var(--white) !important;
  font-family: 'Barlow', sans-serif !important;
  font-weight: 800 !important;
  font-size: 1rem !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  padding: 15px 30px !important;
  border-radius: 60px !important;
  border: 2px solid var(--brand) !important;
  white-space: nowrap !important;
  text-decoration: none !important;
  align-items: center !important;
  gap: 10px !important;
  box-shadow: 0 6px 32px rgba(0,0,0,0.6),
              0 0 0 0 var(--brand-glow) !important;
  animation: yl-pulse 2.8s infinite !important;
}

.yl-sticky-call:hover {
  background: var(--brand) !important;
  color: var(--white) !important;
  border-color: var(--brand) !important;
  animation: none !important;
  opacity: 1 !important;
  text-decoration: none !important;
}

@keyframes yl-pulse {
  0%   { box-shadow: 0 6px 32px rgba(0,0,0,.6), 0 0 0 0   var(--brand-glow); }
  60%  { box-shadow: 0 6px 32px rgba(0,0,0,.6), 0 0 0 14px rgba(205,135,185,0); }
  100% { box-shadow: 0 6px 32px rgba(0,0,0,.6), 0 0 0 0   rgba(205,135,185,0); }
}

@media (max-width: 767px) {
  .yl-sticky-call { display: flex; }
}

</style>
